<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>

<style>
    body {
        margin: 0;
        background: #70c5ce;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        position: relative;
    }

    canvas {
        border: 4px solid white;
        background: linear-gradient(#70c5ce, #bfefff);
    }

    #score {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 32px;
        font-weight: bold;
        text-shadow: 2px 2px 4px black;
        z-index: 2;
    }

    #startScreen {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        height: 600px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: white;
        background: rgba(0, 0, 0, 0.25);
        z-index: 1;
        padding: 24px;
        box-sizing: border-box;
    }

    #startScreen .panel {
        background: rgba(0, 0, 0, 0.35);
        border: 2px solid rgba(255, 255, 255, 0.7);
        border-radius: 16px;
        padding: 24px;
        max-width: 280px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    #startScreen h1 {
        margin: 0 0 12px;
        font-size: 34px;
    }

    #startScreen p {
        margin: 10px 0;
        font-size: 18px;
        line-height: 1.4;
    }

    #startScreen .hint {
        font-size: 16px;
        opacity: 0.95;
    }
</style>
</head>

<body>

<div id="score">0</div>

<div id="startScreen">
    <div class="panel">
        <h1>Flappy Bird</h1>

        <p>
            Press <strong>Space</strong> or tap to start.
        </p>

        <p>
            Tap or press <strong>Space</strong> to flap.
        </p>

        <p class="hint">
            Avoid hitting the pipes or the ground.
        </p>
    </div>
</div>

<canvas id="game" width="400" height="600"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const startScreen = document.getElementById("startScreen");


// -------------------------
// Bird
// -------------------------

const bird = {
    x: 80,
    y: 250,
    radius: 18,
    velocity: 0
};


// Easier physics
const gravity = 0.18;
const flap = -6.5;


// -------------------------
// Pipes
// -------------------------

const pipes = [];

const pipeWidth = 58;
const gap = 280;
const pipeSpeed = 2.2;
const pipeInterval = 130;


// -------------------------
// Game variables
// -------------------------

let frame = 0;
let score = 0;

let gameOver = false;
let started = false;


// -------------------------
// Start game
// -------------------------

function startGame() {

    if (started) {
        return;
    }

    started = true;

    bird.y = 250;
    bird.velocity = 0;

    frame = 0;

    if (!pipes.length) {
        createPipe();
    }

    startScreen.style.display = "none";
}


// -------------------------
// Create pipe
// -------------------------

function createPipe() {

    let topHeight = Math.random() * (canvas.height - gap - 140) + 70;

    pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        passed: false
    });
}


// -------------------------
// Draw bird
// -------------------------

function drawBird() {

    // Body
    ctx.fillStyle = "yellow";

    ctx.beginPath();

    ctx.arc(
        bird.x,
        bird.y,
        bird.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Beak
    ctx.fillStyle = "orange";

    ctx.beginPath();

    ctx.moveTo(
        bird.x + 15,
        bird.y
    );

    ctx.lineTo(
        bird.x + 28,
        bird.y - 5
    );

    ctx.lineTo(
        bird.x + 15,
        bird.y + 5
    );

    ctx.fill();


    // Eye
    ctx.fillStyle = "black";

    ctx.beginPath();

    ctx.arc(
        bird.x + 5,
        bird.y - 5,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


// -------------------------
// Draw pipes
// -------------------------

function drawPipes() {

    ctx.fillStyle = "green";

    pipes.forEach(pipe => {

        // Top pipe
        ctx.fillRect(
            pipe.x,
            0,
            pipeWidth,
            pipe.top
        );


        // Bottom pipe
        ctx.fillRect(
            pipe.x,
            pipe.bottom,
            pipeWidth,
            canvas.height - pipe.bottom
        );

    });
}


// -------------------------
// Update game
// -------------------------

function update() {

    if (!started || gameOver) {
        return;
    }

    frame++;


    // Bird physics
    bird.velocity += gravity;
    bird.y += bird.velocity;


    // Create pipes regularly
    if (frame % pipeInterval === 0) {
        createPipe();
    }


    // Move pipes
    pipes.forEach(pipe => {

        pipe.x -= pipeSpeed;


        // Pipe collision
        if (
            bird.x + bird.radius > pipe.x &&
            bird.x - bird.radius < pipe.x + pipeWidth &&
            (
                bird.y - bird.radius < pipe.top ||
                bird.y + bird.radius > pipe.bottom
            )
        ) {

            gameOver = true;
        }


        // Score
        if (
            !pipe.passed &&
            pipe.x + pipeWidth < bird.x
        ) {

            pipe.passed = true;

            score++;

            document.getElementById("score").innerText = score;
        }

    });


    // Remove pipes that leave screen
    while (
        pipes.length &&
        pipes[0].x < -pipeWidth
    ) {

        pipes.shift();
    }


    // Ground and ceiling collision
    if (
        bird.y + bird.radius >= canvas.height ||
        bird.y - bird.radius <= 0
    ) {

        gameOver = true;
    }
}


// -------------------------
// Draw game
// -------------------------

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawPipes();
    drawBird();


    // Game Over screen
    if (gameOver) {

        ctx.fillStyle = "rgba(0,0,0,.6)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle = "white";

        ctx.font = "40px Arial";

        ctx.fillText(
            "Game Over",
            95,
            250
        );


        ctx.font = "24px Arial";

        ctx.fillText(
            "Score: " + score,
            150,
            300
        );


        ctx.fillText(
            "Press R or Tap to Restart",
            70,
            350
        );
    }
}


// -------------------------
// Main game loop
// -------------------------

function loop() {

    update();

    draw();

    requestAnimationFrame(loop);
}


// -------------------------
// Keyboard controls
// -------------------------

document.addEventListener("keydown", e => {

    // Space
    if (e.code === "Space") {

        if (!started) {

            startGame();

            return;
        }


        if (!gameOver) {

            // One press = one flap
            bird.velocity = flap;
        }
    }


    // R = restart
    if (e.key === "r" || e.key === "R") {

        if (gameOver) {

            location.reload();
        }
    }

});


// -------------------------
// Mouse / mobile controls
// -------------------------

document.addEventListener("pointerdown", e => {

    e.preventDefault();

    // Start
    if (!started) {

        startGame();

        return;
    }


    // Restart
    if (gameOver) {

        location.reload();

        return;
    }


    // One click = one flap
    bird.velocity = flap;
});


// Start the game loop
loop();

</script>

</body>
</html>
